[project]
name = "devmind"
version = "0.1.0"
description = "Autonomous long-horizon coding agent — plans, patches, tests, and self-corrects, then waits for human approval before opening a pull request."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "docker>=7.1",
    "rich>=13.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
devmind = "devmind.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["devmind"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "frontmatter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# Domain classes named Test* (TestRunRepository, TestRunModel — matching
# TestRunModel's own table) and fastapi.testclient.TestClient both trigger pytest's
# "looks like a test class" heuristic on name alone. Harmless — neither is
# collectible (both require constructor args) — so this is the standard suppression
# every project using either ends up needing.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.coverage.run]
source = ["src/devmind"]

[tool.coverage.report]
show_missing = true
skip_empty = true
